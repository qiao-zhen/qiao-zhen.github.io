# 复刻提示词（复制下面全部内容，发给 WorkBuddy 即可生成同款工作台）

---

请帮我从零搭建一个个人综合工作台单页应用，命名为「桥桥工作台」，要求 1:1 复刻以下规格。交付物：单文件 `index.html`（内联 CSS/JS，无框架无构建）、同目录 `data.json`、`.nojekyll`、`push_repo.js`。

## 一、技术栈与部署
- 纯前端：单文件 HTML + CSS + JS + localStorage，无后端、无构建步骤。
- 用户笔记/打卡/台账存 `localStorage`（按模块分 key，如 wb_knowledge / wb_asset / wb_checkin / wb_todo，存 JSON 数组，提供增删改查与卡片渲染）。
- 联网 AI 内容（理财新知、运营思路、选题灵感、指数跟踪、**基金跌涨**）抽离到同目录 `data.json`，页面用 `fetch('./data.json?t='+Date.now(), {cache:'no-store'})` 每次打开自动拉取最新。理财新知板块"最后更新时间"从 data.json 最新日期动态读取（不要硬编码）。
- 部署：GitHub Pages，仓库名必须为 `<你的GitHub用户名>.github.io`（user site 硬规则，不能另起前缀），上传上述三文件 + `.nojekyll`，Settings→Pages→Source 选 main 分支 /root。本地 file:// 打开仅显示演示兜底。
- 提供 `push_repo.js`（Node）：用 GitHub fine-grained PAT（仅该仓库 Contents 读写）把 index.html 和 data.json PUT 到仓库，实现"对话触发抓取→AI 推 data.json→用户刷新即见最新"。
- 禁止图表可视化、禁止高饱和花哨配色、禁止闪烁特效。
- **用户数据云端同步（可选）**：用户笔记/打卡/台账/待办等个人数据除了存 localStorage，还可开启「☁ 同步」直连 GitHub API（`api.github.com`）读写 `userData.json`（base64 UTF-8，先取 sha 再 PUT、409 重试），token 仅存用户浏览器本地 `localStorage`、不上传；拦截 `Storage.setItem` 防抖约 0.7s 自动推送。AI 策展内容（理财新知/运营/选题/指数/基金跌涨）仍走 `data.json`（对话发「刷新」写入）。⚠️ 云端同步**不要**用 Cloudflare Worker（对中国大陆用户不可靠），必须直连 GitHub API。

## 二、视觉规范（1:1 复刻）
- 主色：白底；深粉标题 `#E91E63`；主粉按钮 `#F06292`；浅粉背景 `#FCE4EC`；中粉激活态 `#FFB6C1`。
- 顶部导航栏 `.top-bar`：左侧 ☰ 汉堡 + 文字「桥桥工作台」（粉色圆点 + 文字 logo），右侧 `.mcp-wrap` 放 MCP 总开关（toggle 开关，开=允许 AI 联网拉取资讯）。其下方独立一行 `.search-top-row` 放全局搜索框（输入框 + 搜索图标按钮，placeholder「全局搜索工作台内容…」）。
- 左侧导航栏 `.sidebar`：白底、无右侧黑线；大类 `.group-title` 可折叠（▼/▶ 切换，调用 `toggleGroup(n)`）；小类 `.sub-item` 有轻微边框，默认最浅粉背景、hover 浅粉、active 更深粉。
- 移动端 `@media (max-width:768px)`：汉堡菜单，触屏直显不需 hover；用 flex `order` 控制顶栏顺序（☰+标题 order:1，MCP order:2，搜索 order:3）。
- 卡片圆角 + 柔和阴影；所有"新增/保存/AI抓取"按钮统一放模块标题右侧，做成 pill 形圆角按钮。

## 三、导航结构（6 大类 22 子页，data-page 如下）
1. 🚀 AI新账号运营（group 1）
   - `operation-ideas` 运营思路&选题素材库（AI 抓取）
   - `account-observe` 对标账号观测记录
   - `work-review` 作品复盘记录表
2. 👕 AI 服装带货（group 2）
   - `product-lib` 选品库管理
   - `idea-lib` 选题灵感库（AI 抓取）
   - `script-lib` 短视频脚本库
   - `prompt-lib` AI 素材提示词仓库
   - `record-review` 发布记录&复盘
3. 💸 赚钱思路与副业机会（group 3）
   - `side-idea` 灵感脑洞库（手记+接收搬运）
   - `project-eval` 项目评估池
   - `project-test` 项目测试记录
   - `project-archive` 项目归档复盘
4. 📈 理财研究（group 4）
   - `finance-news` 理财每日新知（AI 抓取，每条带原文 URL）
   - `asset-account` 持仓台账
   - `index-track` 指数跟踪表
   - `rebalance` 调仓再平衡记录
5. 🧘 健康养生（group 5）
   - `health-checkin` 今日打卡面板（唯一允许用表格的模块）
   - `checkin-history` 查看历史打卡汇总
   - `body-note` 身体观察备忘录
6. 📑 通用工具（group 6）
   - `knowledge-base` 知识库笔记（默认首页）
   - `todo-list` 今日待办清单

快捷指令（对话发这些词跳转对应页）：工作台首页 / 短视频脚本 / 理财台账 / 指数跟踪表 / 调仓记录 / 今日养生打卡 / 打卡历史汇总 / 运动规划 / 今日待办 / MCP开关-开 / MCP开关-关 / 重置记忆。

## 四、各模块功能与字段
- 知识库笔记（通用工具下，默认首页）：**粘贴录入**——点「粘贴」按钮，把对话里 AI 分析好的内容整段粘进 textarea，点「生成卡片」即存为一张卡片（标题取首行）。**卡片标题后直接显示所属分类标签（如「养生」）**；整页顶部保留「全部/理财/养生/AI/运营」筛选栏（页面级过滤）。**卡片内不再有可切换的 4 个分类小标签**（改分类走卡片「✎编辑」弹窗下拉选）。卡片右上角「⧉ 复制」一键复制「【分类】标题+内容」到剪贴板导出；保留编辑/删除。纯 localStorage，无标题/来源/理解等冗余字段；知识库页 header 另有「⚙ 飞书设置」+「导出到飞书」按钮（分类推送到飞书 4 文档，详见六-C）。
- 运营思路&选题素材库（AI 抓取）：读 data.json.operationIdeas（title/content/url/date）；>100 字显示省略号 +「查看全文 ›」弹窗显示完整 + 原文 URL。
- 对标账号观测记录：账号名 + 平台 + 粉丝数 + 人设 + 爆款特点 + 备注。
- 作品复盘记录表：作品标题 + 发布时间 + 播放 + 点赞 + 转化 + 复盘结论。
- 选品库管理：商品名 + 类目 + 进货价 + 售价 + 卖点 + 状态（pending/hold/done）。
- 选题灵感库（AI 抓取）：读 data.json.ideaLib（title/content/status），状态标签着色。
- 短视频脚本库：脚本名 + 平台 + 钩子 + 正文 + 分镜 + 配乐。
- AI 素材提示词仓库：提示词名 + 正向词 + 负向词 + 适用场景 + 标签。
- 发布记录&复盘：发布时间 + 平台 + 内容 + 数据 + 复盘。
- 灵感脑洞库：想法 + 来源（手记/搬运）+ 时间。
- 项目评估池：项目名称 + 投入 + 预期收益 + 风险 + 评分 + 结论。
- 项目测试记录 / 项目归档复盘：同上结构化字段。
- 理财每日新知（AI 抓取）：读 data.json.financeNews（title/date/source/url/summary/content），每条必须带原文 URL；>100 字省略号 + 查看全文。
- 持仓台账：读 localStorage.holdings（与 data.json.holdings 同结构）。字段 name/code/amount(市值)/type{gold|nasdaq|dividend|qdii|other}/cost(成本)/dca{enabled,daily,lastDate,acc}。类型显示映射：gold→黄金，nasdaq→纳斯达克100，dividend→红利低波，qdii→**标普500跟踪摩根**，other→其它基金。⚠️ 内部 value 用 qdii，但显示文案必须用"标普500跟踪摩根"，**禁止出现"QDII基金"字样**。每张卡片底部一行：左侧更新时间 + 右侧 定投/编辑/删除 按钮。卡片上的跌涨/今日收益数据来自全局 `fundQuote`（优先取 data.json.fundQuotes 自动填充；也可点「🔄刷新涨跌」按钮前端直连东方财富补抓）。注意 QDII/美股基金日期会滞后（T+1），属正常现象。
- 指数跟踪表：读 data.json.indexTrack。每指数一张卡，含 icon/color、前 2 行核心指标（rows.label/val）、💡 个人判断长文 note、数据来源行。四个指数：黄金（金价 / 实际利率=10Y TIPS 真实值，不用名义美债）、纳斯达克100（PE / 估值分位）、红利低波（股息率 / 估值分位）、标普500跟踪摩根（底层标的 / 溢价率 / 限购状态 / 汇率影响）。注意：黄金显示"实际利率"（真实 TIPS），其他模块不要美债行。
- 调仓再平衡记录：时间 + 标的 + 动作(加/减/调) + 金额 + 理由。
- 今日打卡面板：唯一表格模块。行=打卡项（如 睡眠/运动/饮水），可勾选打卡保存。
- 查看历史打卡汇总：点「AI汇总本月」按钮 → **纯本地**（读 `localStorage.checkinRecords[本月]`，不联网、不拉 data.json）按月聚合打卡数据，显示「本月已打卡 N 天」+ 睡眠/运动/食疗/体感 各维度打卡天数标签 + 每维度最近 3 天明细；打开页面自动渲染。
- 身体观察备忘录：日期 + 症状/观察 + 备注（仅记录，不适提示就医）。
- 今日待办清单：待办项 增/删/勾选，localStorage 持久化。
- 文章/链接分析：不单独做模块（纯前端无法真摘要）。流程——用户把文章/链接直接发对话让 AI 分析，需沉淀时去「通用工具 → 知识库笔记」点「粘贴」把分析结果粘进来即生成卡片（分类选理财/养生/AI/运营）。复刻时**不要**生成 web-summary 模块。

## 四-B. 全局搜索（重写后行为，必须照此实现）

- **触发**：回车或点搜索按钮（**不再**边打字边跳模块）。
- **检索范围**：跨所有模块（知识库、理财、待办、打卡、脚本、选品……含 AI 抓取内容）的**标题+正文**做全文检索。
- **匹配规则**：按空格分词，**多个词需全部命中**才返回（如「黄金 ETF」能命中卡片里写的「黄金ETF」）；标题命中加权靠前。
- **结果呈现**：弹出**结果列表弹窗**，每条显示「来自哪个模块 + 标题 + 匹配片段」，不自动乱跳。
- **点击结果**：仅当点击某条结果，才跳转对应模块页、滚动定位到那张卡片、并**红色描边闪两下**（`#E91E63` 红框，约 2.4 秒消失）。
- **快捷入口**：仅当输入**完整等于**某模块名（如「理财」「待办」「打卡」）时才直接打开该模块页，作为有意快捷跳转，不视为乱跳。
- 无命中 → 提示「未找到与『xxx』相关的内容」。

## 五、铁律（必须严格遵守）

**⚠️ 铁令（最高优先级）：所有数据必须真实可追溯，绝对禁止编造 / 猜测 / 占位 / 乱写乱改。** 没联网取到、没真实录入就如实显示「--」「待刷新」并告知用户"未取到"，绝不蒙数、不填假值；内置兜底值若与真实数据不符一律以真实数据为准，且不得把兜底值当"已核实"展示。

1. 客观独立判断，批判性视角，不迎合。
2. 取消表格优先：除「今日打卡面板」外一律用卡片+文字+输入框，不用表格。
3. 理财：仅台账/估值整理，严禁任何买卖建议。
4. 健康：仅记录计划，身体不适提示就医。
5. 网页遇 Cloudflare 验证 → 暂停并提示用户手动介入。
6. 优先本地文件读写；AI 联网动作必须用户手动触发，禁止全自动静默调用消耗 MCP 积分。
7. MCP 总开关：一键关闭全部自动资讯拉取；关闭时仅本地读写。
8. 改动最小原则：用户只要求改某处，只改那处，不得顺手改动其它样式/按钮/配色。

## 六、刷新机制
- 对话发「刷新」二字 → AI 联网抓取并写入 data.json 推送以下**全部 5 项**：
  ① 理财每日新知（带 URL）② 指数跟踪表（所有 rows 数值）③ 运营思路&选题素材库 ④ 选题灵感库 ⑤ **基金实时跌涨**（见下，写入 data.json.fundQuotes）。
- 基金跌涨也由 AI 抓取：发"刷新"时通过东方财富接口 `https://fund.eastmoney.com/pingzhongdata/{code}.js`（JSONP **顺序加载**，避免 Data_netWorthTrend 全局变量串号）抓每只持仓基金最新估值/跌涨，取 Data_netWorthTrend 末项 equityReturn/y/x，写入 data.json.fundQuotes。⚠️ 没收盘也有实时估值可用（给的是已公布净值 + 盘中估算），不必等收盘。
- 页面 `loadRemoteData()` 拉到 data.json 后，自动把 fundQuotes 填入全局 `fundQuote` 变量（持仓卡片据此显示跌涨/今日收益），无需用户再单独点"🔄刷新涨跌"。
- 闭环：AI 推送后页面点「AI刷新抓取」按钮（或刷新页面）即拉最新 data.json；理财新知板块"最后更新时间"自动取 financeNews 最新 date 显示。

## 六-B. 云端数据同步（可选功能，必须实现「☁ 同步」入口）

**功能说明**：默认数据纯本地（localStorage）；可选开启「☁ 同步」把用户的个人数据（知识库笔记 / 持仓台账 / 打卡 / 待办 / 各模块录入）备份到**用户自己的 GitHub 仓库**，实现跨设备、换手机不丢。

- **触发入口**：顶栏提供「☁ 同步」按钮，点击弹窗让用户输入自己的 GitHub **fine-grained Token**（仅授权该仓库 Contents 读写），设置入口即存浏览器本地 `localStorage['syncGithubToken']`、不上传。
- **存储与读写**：直连 `https://api.github.com/repos/<用户名>/<用户名>.github.io/contents/userData.json`，GET 读取 / PUT 写入（base64 UTF-8，先取 sha 再 PUT、遇 409 重试）；同步 key 为 16 个用户数据 key，拦截 `Storage.setItem` 防抖约 0.7s 自动推送。
- **与 data.json 分工（两文件分离）**：AI 策展内容（理财新知 / 运营思路 / 选题灵感 / 指数跟踪 / 基金跌涨）走 `data.json`（对话发「刷新」写入，页面 fetch 拉取）；用户个人录入数据走 `userData.json`（☁ 同步写入）。二者互不覆盖。
- **⚠️ 禁区**：云端同步**不要**用 Cloudflare Worker（对中国大陆用户不可靠、手机端常连不上）；必须直连 GitHub API（`api.github.com` 与 `raw.githubusercontent.com` 均返回 `Access-Control-Allow-Origin: *`，从 `*.github.io` 网页直连无跨域问题）。
- 容错：云端数据含 null 字段时写入 localStorage 前须 `null→[]` 兜底，避免 `render` 读 `null.length` 崩溃；拉取失败不阻断本地使用，仅提示。

## 六-C. 知识库笔记导出到飞书（可选功能，必须实现「导出到飞书」按钮）

**功能说明**：把知识库笔记按 理财 / 养生 / AI / 运营 4 类，一键分类推送到用户飞书里对应的 4 个文档（理财文档 / 养生文档 / AI 文档 / 运营文档）。手机点一下即推送，无需电脑、不经过 AI。

- **按钮位置**：知识库笔记页 header，「粘贴」按钮左侧放「⚙ 飞书设置」（ghost 样式），其左放「导出到飞书」主按钮。
- **架构（关键，必须照此）**：纯前端网页浏览器直连 `open.feishu.cn` 会被 CORS 拦截，且 app_secret 不能进前端代码。因此采用「**服务端函数中转**」：
  - 网页只负责把 4 类笔记 `POST` 给一个服务端函数（函数地址由用户在「⚙ 飞书设置」弹窗填写，存 `localStorage['feishuPush']={endpoint,token}`，不上传）。
  - 服务端函数（推荐**阿里云函数计算 FC**，Node.js，Proxy 模式；不要用 Cloudflare Worker——国内不可达）持有飞书密钥（环境变量 `FEISHU_APP_ID` / `FEISHU_APP_SECRET` / `FEISHU_DOC_LICAI` / `FEISHU_DOC_YANGSHENG` / `FEISHU_DOC_AI` / `FEISHU_DOC_YUNYING`，可选 `FEISHU_PUSH_TOKEN`），调用飞书 API：取 `tenant_access_token` → 对每个分类文档先删旧 blocks 再 append 新 blocks（每批 ≤ 50）。函数须正确处理 CORS 预检（OPTIONS 返回放行头、响应带 `Access-Control-Allow-Origin`）。
  - 密钥只存在服务端，不进前端、不经过 AI，安全。
- **降级**：若用户未配置函数地址，`exportToFeishu()` 必须**降级为下载 JSON**（`feishu_export_<日期>.json`，4 类分组），提示用户仍可本机跑 `node push_feishu.js` 推送；不可因未配置而报错卡死。
- **推送行为**：飞书文档会被**先清空再写入**最新笔记（避免重复堆积），复刻时须在「⚙ 飞书设置」hint 与部署指南里提示用户：这 4 个文档只用来存对应分类笔记。
- **替代方案（电脑党）**：不部署服务端函数时，可提供 `push_feishu.js`（Node，无第三方依赖）本地脚本 + `feishu_config.example.json` 配置示例，用户本机 `node push_feishu.js` 推送。

## 九、使用说明（拿到这份提示词的人直接看这里）

> 下面是你（复刻者/使用者）拿到「桥桥工作台」之后的上手指南，无需再问人。

### 1. 部署上线（一次即可，之后免维护）

1. 注册 GitHub（免费，无须实名）。
2. **新建仓库，仓库名必须一字不差为 `<你的用户名>.github.io`**（例如用户名是 `qiao-zhen` 就建 `qiao-zhen.github.io`）。⚠️ 这是 GitHub Pages 个人站硬规则，不能另起前缀、不能少 `.github.io`，否则拿不到短网址。
3. 把 AI 生成的 4 个文件（`index.html`、`data.json`、`.nojekyll`、`push_repo.js`）上传到这个仓库的 main 分支根目录。
4. 仓库 → Settings → Pages → Source 选 `main` 分支 / `root` → Save。
5. 等 1~2 分钟，访问 `https://<你的用户名>.github.io` 即可。
6. **手机（iPhone/安卓）当 App 用**：用手机浏览器（Safari/Chrome）打开上面网址 → 点「分享 / 添加到主屏幕」→ 桌面就多了一个「桥桥工作台」图标，点开即全屏使用，无需下载安装。

### 2. 日常使用

- **本地数据**：打卡、笔记、待办、台账等都存在你自己浏览器/手机的 localStorage，**实时保存**；默认纯本地（换设备不自动同步），如需跨设备，点顶栏「☁ 同步」用你自己 GitHub token 接入（数据存你自己的仓库 `userData.json`，token 只留你本地）。
- **全局搜索**：顶部搜索框输入关键词（如"黄金""脚本""待办"）可跳转到对应模块。
- **快捷指令**：在和 WorkBuddy 的对话里发「工作台首页 / 理财台账 / 指数跟踪表 / 今日养生打卡 / 打卡历史汇总 / 今日待办 / MCP开关-开 / MCP开关-关」等词，可让你跳转对应页或开关。
- **MCP 总开关**（顶栏右上）：控制"AI 抓取按钮"是否可用。关掉后页面只读写本地、不再触发任何联网拉取。

### 3. 让 AI 帮你刷新数据（关键）

- 在**对话里发「刷新」两个字** → WorkBuddy 会联网抓取最新：① 理财每日新知 ② 指数跟踪表 ③ 运营思路 ④ 选题灵感 ⑤ 基金实时跌涨，并推送到你的 GitHub 仓库。
- 推送完成后，**刷新（或重开）工作台页面** → 点「AI刷新抓取」按钮（或直接重开）即拉到最新 `data.json`，数据与涨跌自动更新。
- ⚠️ 基金跌涨里 QDII/美股基金日期会滞后 1 天（T+1），属正常，不是 bug。
- 如果自己有 GitHub fine-grained Token（仅该仓库 Contents 读写），发给 WorkBuddy，可让它直接 `git` 推送，省去你手动上传。

### 4. 各模块一句话指引

- **知识库笔记**（默认首页）：看到好文章/链接 → 对话让 AI 分析 → 点「粘贴」把结果粘进来 → 「生成卡片」→ 卡片上点标签选 理财/养生/AI/运营 → 要带走点「⧉复制」或「⤓导出」。
- **持仓台账**：点「🔄刷新涨跌」可补抓当日基金估值；「定投」设金额后从当天起每日累计（不回溯）。
- **今日打卡面板**：唯一用表格的模块，填完点「保存今日打卡」。
- **查看历史打卡汇总**：点「AI汇总本月」→ 本地即时生成当月各维度打卡统计，不联网。
- **今日待办清单**：填「内容 + 优先级 + 时间」，自动按 高→中→低、同优先级最新时间在上排序。

### 5. 注意事项

- 本地 `file://` 直接打开只能看演示兜底，**联网数据需部署到 GitHub Pages 后才生效**。

<script>
  var RAW = document.getElementById('rawmd').textContent;
  document.getElementById('pageUrl').value = location.href;

  function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inline(s){
    s = escapeHtml(s);
    s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return s;
  }

  function render(md){
    var lines = md.split('\n');
    var html = '', inCode = false, codeBuf = [], listOpen = null;
    function closeList(){ if(listOpen){ html += '</'+listOpen+'>'; listOpen = null; } }
    for (var i=0;i<lines.length;i++){
      var line = lines[i];
      if (line.indexOf('```') === 0){
        if (!inCode){ inCode = true; codeBuf = []; }
        else { inCode = false; html += '<pre class="code"><code>'+escapeHtml(codeBuf.join('\n'))+'</code></pre>'; }
        continue;
      }
      if (inCode){ codeBuf.push(line); continue; }
      if (/^### /.test(line)){ closeList(); html += '<h3>'+inline(line.slice(4))+'</h3>'; continue; }
      if (/^## /.test(line)){ closeList(); html += '<h2>'+inline(line.slice(3))+'</h2>'; continue; }
      if (/^# /.test(line)){ closeList(); html += '<h1>'+inline(line.slice(2))+'</h1>'; continue; }
      if (line.trim() === '---'){ closeList(); html += '<hr>'; continue; }
      if (/^>\s?/.test(line)){ closeList(); html += '<blockquote>'+inline(line.replace(/^>\s?/,''))+'</blockquote>'; continue; }
      if (/^\d+\.\s/.test(line)){ if(listOpen!=='ol'){ closeList(); html+='<ol>'; listOpen='ol'; } html += '<li>'+inline(line.replace(/^\d+\.\s/,''))+'</li>'; continue; }
      if (/^[-*]\s/.test(line)){ if(listOpen!=='ul'){ closeList(); html+='<ul>'; listOpen='ul'; } html += '<li>'+inline(line.replace(/^[-*]\s/,''))+'</li>'; continue; }
      if (line.trim() === ''){ closeList(); continue; }
      closeList(); html += '<p>'+inline(line)+'</p>';
    }
    if (inCode) html += '<pre class="code"><code>'+escapeHtml(codeBuf.join('\n'))+'</code></pre>';
    closeList();
    return html;
  }

  document.getElementById('rendered').innerHTML = render(RAW);

  var toastTimer;
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  function copyAll(){
    navigator.clipboard.writeText(RAW).then(function(){
      toast('已复制全部提示词 ✓ 去 WorkBuddy 粘贴发送即可');
    }).catch(function(){
      // 兜底
      var ta = document.createElement('textarea'); ta.value = RAW;
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('已复制全部提示词 ✓ 去 WorkBuddy 粘贴发送即可'); }
      catch(e){ toast('复制失败，请手动长按选择'); }
      document.body.removeChild(ta);
    });
  }

  function sendToWB(){
    navigator.clipboard.writeText(RAW).then(function(){
      toast('已复制 ✓ 请打开 WorkBuddy 对话粘贴并发送');
    }).catch(function(){
      var ta = document.createElement('textarea'); ta.value = RAW;
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('已复制 ✓ 请打开 WorkBuddy 对话粘贴并发送'); }
      catch(e){ toast('复制失败，请手动长按选择'); }
      document.body.removeChild(ta);
    });
  }
</script>
